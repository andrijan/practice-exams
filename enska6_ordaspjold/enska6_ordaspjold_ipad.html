<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enska 6. bekkur Orðaspjöld</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #F1F4F8;
    --surface: #FFFFFF;
    --surface-2: #E4EAF2;
    --ink: #16202C;
    --muted: #5F6C7D;
    --line: #CDD6E1;
    --en: #1E3F8A;
    --en-soft: #E2E9F9;
    --is: #C2233A;
    --is-soft: #FBE3E7;
    --def: #6B7686;
    --ok: #24744F;
    --ok-ink: #FFFFFF;
    --ok-soft: #DDF0E6;
    --again: #A0620F;
    --again-soft: #FBEBD2;
    --focus: #1E3F8A;
    --shadow: 0 12px 32px rgba(22, 32, 44, .10), 0 1px 3px rgba(22, 32, 44, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F151E;
      --surface: #1A2331;
      --surface-2: #232E3F;
      --ink: #E9EEF5;
      --muted: #9AA7B8;
      --line: #34405280;
      --en: #9DB4F5;
      --en-soft: #22304F;
      --is: #F28B99;
      --is-soft: #4A2029;
      --def: #A7B2C2;
      --ok: #6FCB9A;
      --ok-ink: #0F151E;
      --ok-soft: #1E3A2D;
      --again: #E4B15C;
      --again-soft: #3F2F16;
      --focus: #9DB4F5;
      --shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F151E;
    --surface: #1A2331;
    --surface-2: #232E3F;
    --ink: #E9EEF5;
    --muted: #9AA7B8;
    --line: #34405280;
    --en: #9DB4F5;
    --en-soft: #22304F;
    --is: #F28B99;
    --is-soft: #4A2029;
    --def: #A7B2C2;
    --ok: #6FCB9A;
    --ok-ink: #0F151E;
    --ok-soft: #1E3A2D;
    --again: #E4B15C;
    --again-soft: #3F2F16;
    --focus: #9DB4F5;
    --shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: .9rem;
  }

  /* header */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; font-size: 1.7rem; line-height: 1.05; margin: .1rem 0 0; letter-spacing: -.01em; }
  .ghost {
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
    padding: .5rem .95rem; border-radius: 10px; font-weight: 700; font-size: .92rem; white-space: nowrap;
  }
  .ghost:hover { border-color: var(--muted); }

  /* segmented controls */
  .controls { display: flex; flex-wrap: wrap; gap: .6rem; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    padding: .5rem .85rem; border-radius: 9px; font-weight: 700; font-size: .92rem; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  .seg .en { color: var(--en); }
  .seg .is { color: var(--is); }
  .seg button:not([aria-pressed="true"]) .en, .seg button:not([aria-pressed="true"]) .is { color: inherit; }

  /* progress */
  .progress { display: flex; flex-direction: column; gap: .35rem; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .3s ease; }
  .counts { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counts b { color: var(--ink); font-weight: 700; }

  /* card */
  .scene { perspective: 1400px; }
  .card {
    position: relative;
    height: clamp(300px, 52vh, 540px);
    cursor: pointer;
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .22s ease, opacity .22s ease;
    outline: none;
  }
  .card:focus-visible .face { box-shadow: var(--shadow), 0 0 0 3px var(--focus); }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border-radius: 18px; box-shadow: var(--shadow);
    padding: 1rem 1.3rem 1rem; display: flex; flex-direction: column; overflow: hidden;
  }
  .face::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--edge, var(--line)); }
  .face.en { --edge: var(--en); }
  .face.is { --edge: var(--is); }
  .face.def { --edge: var(--def); }
  .back { transform: rotateY(180deg); }
  .card.leave-right { transform: translateX(110px) rotate(4deg); opacity: 0; }
  .card.leave-left { transform: translateX(-110px) rotate(-4deg); opacity: 0; }
  .card.enter { transform: translateY(14px); opacity: 0; }
  .card.no-anim, .card.no-anim .inner { transition: none !important; }

  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  .meta .lang { white-space: nowrap; }
  .meta .lang.en { color: var(--en); }
  .meta .lang.is { color: var(--is); }
  .meta .lang.def { color: var(--def); }
  .meta .tab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .55rem; overflow: auto; padding: .4rem 0; }
  .word {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.1; letter-spacing: -.01em;
    text-wrap: balance; max-width: 16ch; color: var(--ink);
  }
  .word.en { color: var(--en); }
  .word.is { color: var(--is); }
  .word.def { font-style: italic; font-weight: 400; font-size: clamp(1.25rem, 3.6vw, 1.7rem); line-height: 1.35; max-width: 30ch; color: var(--ink); }
  .alt { font-style: italic; color: var(--muted); font-size: .98rem; }
  .rule { width: min(60%, 260px); height: 0; border: 0; border-top: 1px solid var(--line); margin: .4rem 0; }
  .gloss { color: var(--ink); font-size: 1.05rem; line-height: 1.45; max-width: 36ch; text-wrap: pretty; }
  .gloss .k { color: var(--muted); font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-right: .35rem; }
  .gloss .is { color: var(--is); font-weight: 700; }
  .gloss .en { color: var(--en); font-weight: 700; }
  .tip { text-align: center; font-size: .8rem; color: var(--muted); }
  .back .tip { visibility: hidden; }

  /* actions */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .btn { border: 0; border-radius: 14px; min-height: 58px; padding: .7rem 1rem; font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; transition: transform .08s ease, filter .15s ease; }
  .btn:active { transform: scale(.985); }
  .btn.ok { background: var(--ok); color: var(--ok-ink); }
  .btn.ok:hover { filter: brightness(1.06); }
  .btn.again { background: var(--again-soft); color: var(--again); border: 1.5px solid var(--again); }
  .btn.again:hover { filter: brightness(.98); }
  .btn svg { width: 1.1em; height: 1.1em; }
  .hint { margin: 0; text-align: center; font-size: .82rem; color: var(--muted); }
  .hint .kbd { display: none; }
  @media (hover: hover) and (pointer: fine) { .hint .touch { display: none; } .hint .kbd { display: inline; } }
  kbd { font: inherit; font-size: .78rem; background: var(--surface-2); padding: .05rem .4rem; border-radius: 5px; border: 1px solid var(--line); }
  .foot { text-align: center; }
  .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .88rem; padding: .3rem .5rem; }
  .linkish:hover { color: var(--ink); }

  /* round summary */
  .done { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 1.4rem 1.4rem 1.3rem; position: relative; overflow: hidden; }
  .done::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--ok); }
  .done .big { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; color: var(--ok); font-variant-numeric: tabular-nums; margin: .3rem 0 .2rem; }
  .done p { margin: .2rem 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .9rem; }
  .chip { background: var(--again-soft); color: var(--ink); border-radius: 999px; padding: .3rem .75rem; font-size: .9rem; }
  .chip .is { color: var(--is); font-weight: 700; }

  /* list view */
  #search { width: 100%; padding: .7rem .95rem; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
  #search::placeholder { color: var(--muted); }
  .group { margin-top: 1.1rem; }
  .group h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.25rem; margin: 0 0 .5rem; }
  .group h2 small { font-family: "Atkinson Hyperlegible", sans-serif; font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: .5rem; }
  .tablewrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: .6rem .8rem; vertical-align: top; border-top: 1px solid var(--line); }
  th { border-top: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  td.w { font-weight: 700; color: var(--en); width: 24%; }
  td.d { color: var(--ink); }
  td.i { width: 26%; }
  td.i .is { color: var(--is); font-weight: 700; }
  td.i .alt { display: block; font-size: .85rem; }
  .empty { color: var(--muted); padding: 1rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .card, .inner, .fill, .btn { transition: none !important; }
  }
  @media (max-width: 420px) {
    .seg button { padding: .45rem .6rem; font-size: .85rem; }
    .face { padding: .85rem 1rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Enska 6. bekkur · Together Again</div>
      <h1>Orðaspjöld</h1>
    </div>
    <button class="ghost" id="listToggle" type="button" aria-pressed="false">Orðalisti</button>
  </header>

  <div class="controls">
    <div class="seg" id="deckSeg" role="group" aria-label="Kafli">
      <button type="button" data-deck="k1" aria-pressed="false">Kafli 1</button>
      <button type="button" data-deck="all" aria-pressed="false">Allt</button>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="Átt">
      <button type="button" data-mode="en-is" aria-pressed="false"><span class="en">EN</span> → <span class="is">ÍS</span></button>
      <button type="button" data-mode="is-en" aria-pressed="false"><span class="is">ÍS</span> → <span class="en">EN</span></button>
      <button type="button" data-mode="def-en" aria-pressed="false">Setning → <span class="en">EN</span></button>
    </div>
  </div>

  <section id="study">
    <div class="progress">
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="counts" aria-live="polite"><span id="countKnown"></span><span id="countLeft"></span></div>
    </div>

    <div class="scene" style="margin-top:.9rem">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Spjald. Bankaðu til að snúa.">
        <div class="inner">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="done" id="done" hidden></div>
    </div>

    <div class="actions" id="actions" style="margin-top:.9rem">
      <button type="button" class="btn again" id="btnAgain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Æfa aftur
      </button>
      <button type="button" class="btn ok" id="btnKnow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Kunni það
      </button>
    </div>
    <div class="actions" id="doneActions" hidden style="margin-top:.9rem">
      <button type="button" class="btn again" id="btnMissed"></button>
      <button type="button" class="btn ok" id="btnAll">Öll orð aftur</button>
    </div>

    <p class="hint" style="margin-top:.8rem">
      <span class="touch">Bankaðu á spjaldið til að snúa því · strjúktu til hægri = kunni, til vinstri = æfa aftur</span>
      <span class="kbd"><kbd>Bil</kbd> snúa · <kbd>→</kbd> kunni · <kbd>←</kbd> æfa aftur</span>
    </p>
    <div class="foot"><button class="linkish" id="btnReset" type="button">Stokka og byrja upp á nýtt</button></div>
  </section>

  <section id="list" hidden>
    <input id="search" type="search" placeholder="Leita að orði…" autocomplete="off" aria-label="Leita í orðalista">
    <div id="listBody"></div>
  </section>
</div>

<script>
(function () {
  const DATA = {"chapters":[{"id":"k1","label":"Kafli 1","title":"Together Again"}],"words":[{"ch":"k1","en":"subject","def":"Maths is my favourite _____ at school.","is":"fag"},{"ch":"k1","en":"chef","def":"I want to work in a restaurant as a _____. I love cooking.","is":"kokkur"},{"ch":"k1","en":"canteen","def":"Madison has lunch in the school _____ at 12 o'clock.","is":"mötuneyti"},{"ch":"k1","en":"difficult","def":"Ava thinks it is _____ to become a professional gamer.","is":"erfitt"},{"ch":"k1","en":"boarding school","def":"Harry sleeps and eats all his meals at school. He goes to a _____.","is":"heimavistarskóli"},{"ch":"k1","en":"embarrassing","def":"Oliver doesn't tell people he wants to be an actor. He thinks it's a bit _____.","is":"vandræðalegt"},{"ch":"k1","en":"PE","def":"Tom plays rugby or tennis every day. His favourite subject is _____.","is":"íþróttir"},{"ch":"k1","en":"programmer","def":"Jack loves computers. He wants to make games, so he wants to be a _____.","is":"forritari"},{"ch":"k1","en":"assembly","def":"On Mondays and Thursdays Zaheer goes to _____ in the main hall.","is":"samverustund"},{"ch":"k1","en":"solve","def":"The police officers hope they can _____ the mystery.","is":"leysa"},{"ch":"k1","en":"ICT","def":"Zaheer's favourite subjects are _____ and science.","is":"tölvu- og upplýsingatækni"},{"ch":"k1","en":"stapler","def":"Dermot's shoes look like they belong to the guy who refills the office _____.","is":"heftari"},{"ch":"k1","en":"expected","def":"The shirt was too big, but Dermot _____ that.","is":"átti von á"},{"ch":"k1","en":"tag","def":"In the break Zaheer and Rob play football or games like _____.","is":"eltingaleikur"},{"ch":"k1","en":"plum","def":"In his purple blazer Dermot looked like a giant _____.","is":"plóma"},{"ch":"k1","en":"grow","def":"Learning together, helping each other _____.","is":"vaxa"},{"ch":"k1","en":"quiet","def":"Martin didn't hear any cars last night. It was really _____.","is":"hljóðlega"},{"ch":"k1","en":"lunch break","def":"Jessica has a _____ at noon. She eats sandwiches and an apple.","is":"hádegishlé"},{"ch":"k1","en":"break-in","def":"All the computers were stolen. There was a _____ at the school.","is":"innbrot"},{"ch":"k1","en":"almost","def":"The girls wear _____ the same uniform as the boys.","is":"næstum því"}]};
  const CH = Object.fromEntries(DATA.chapters.map(c => [c.id, c]));
  const WORDS = DATA.words.map((w, i) => Object.assign({ id: w.ch + ':' + i }, w));
  const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));
  const STORE = 'enska6-together-again-v1';
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const card = $('card'), front = $('front'), back = $('back'), done = $('done');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function deckIds(deck) {
    if (deck === 'all') {
      const seen = new Set();
      return WORDS.filter(w => { const k = w.en.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).map(w => w.id);
    }
    return WORDS.filter(w => w.ch === deck).map(w => w.id);
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  let state = { deck: 'k1', mode: 'en-is', sessions: {} };
  try { const raw = localStorage.getItem(STORE); if (raw) { const s = JSON.parse(raw); if (s && s.sessions && s.deck && s.mode) state = s; } } catch (e) { }
  if (!['k1', 'all'].includes(state.deck)) state.deck = 'k1';
  if (!['en-is', 'is-en', 'def-en'].includes(state.mode)) state.mode = 'en-is';
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { } }

  function newSession(ids, round, subset) { return { queue: shuffle(ids), known: [], missed: [], round: round || 1, subset: !!subset, flipped: false }; }
  const key = () => state.deck + '|' + state.mode;
  function session() {
    const all = deckIds(state.deck), set = new Set(all);
    let s = state.sessions[key()];
    if (!s || !Array.isArray(s.queue)) { s = state.sessions[key()] = newSession(all); return s; }
    s.queue = s.queue.filter(id => set.has(id));
    s.known = (s.known || []).filter(id => set.has(id));
    s.missed = (s.missed || []).filter(id => set.has(id));
    if (!s.subset) { const have = new Set([...s.queue, ...s.known]); all.forEach(id => { if (!have.has(id)) s.queue.push(id); }); }
    if (!s.queue.length && !s.known.length) s = state.sessions[key()] = newSession(all);
    return s;
  }

  /* ---- rendering ---- */
  function tab(w) { const c = CH[w.ch]; return esc(c.label + ' · ' + c.title); }
  function faceHTML(w, side) {
    const m = state.mode;
    let lang, cls, main, extra = '';
    if (side === 'front') {
      if (m === 'en-is') { lang = 'Enska'; cls = 'en'; main = `<div class="word en">${esc(w.en)}</div>`; }
      else if (m === 'is-en') { lang = 'Íslenska'; cls = 'is'; main = `<div class="word is">${esc(w.is)}</div>` + (w.alt ? `<div class="alt">einnig: ${esc(w.alt)}</div>` : ''); }
      else { lang = 'Setning'; cls = 'def'; main = `<div class="word def">${esc(w.def)}</div>`; }
    } else {
      if (m === 'en-is') {
        lang = 'Íslenska'; cls = 'is';
        main = `<div class="word is">${esc(w.is)}</div>` + (w.alt ? `<div class="alt">einnig: ${esc(w.alt)}</div>` : '');
        extra = `<hr class="rule"><div class="gloss">${esc(w.def)}</div>`;
      } else if (m === 'is-en') {
        lang = 'Enska'; cls = 'en';
        main = `<div class="word en">${esc(w.en)}</div>`;
        extra = `<hr class="rule"><div class="gloss">${esc(w.def)}</div>`;
      } else {
        lang = 'Enska'; cls = 'en';
        main = `<div class="word en">${esc(w.en)}</div>`;
        extra = `<hr class="rule"><div class="gloss"><span class="k">ÍS</span><span class="is">${esc(w.is)}</span>${w.alt ? ` <span class="alt">(${esc(w.alt)})</span>` : ''}</div>`;
      }
    }
    return { cls, html: `<div class="meta"><span class="tab">${tab(w)}</span><span class="lang ${cls}">${lang}</span></div><div class="body">${main}${extra}</div><div class="tip">bankaðu til að snúa</div>` };
  }

  function renderControls() {
    document.querySelectorAll('#deckSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.deck === state.deck)));
    document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  }

  function render() {
    renderControls();
    const s = session();
    const total = s.queue.length + s.known.length;
    const known = s.known.length;
    $('fill').style.width = (total ? (known / total) * 100 : 0) + '%';
    $('countKnown').innerHTML = `Kunni <b>${known}</b> af ${total}`;
    $('countLeft').innerHTML = (s.round > 1 ? `Umferð ${s.round} · ` : '') + `Eftir <b>${s.queue.length}</b>`;

    if (!s.queue.length) {
      card.hidden = true; $('actions').hidden = true;
      done.hidden = false; $('doneActions').hidden = false;
      const n = s.missed.length;
      const chips = s.missed.map(id => byId[id]).filter(Boolean).map(w => `<span class="chip">${esc(w.en)} · <span class="is">${esc(w.is)}</span></span>`).join('');
      done.innerHTML = `<div class="eyebrow">${s.round > 1 ? 'Umferð ' + s.round + ' lokið' : 'Umferð lokið'}</div>
        <div class="big">${total - n} <span style="font-size:.5em;color:var(--muted);font-weight:500">af ${total}</span></div>
        <p>${n === 0 ? 'Allt rétt í fyrstu tilraun. Vel gert!' : 'rétt í fyrstu tilraun'}</p>
        ${n ? `<p style="margin-top:.8rem"><b style="color:var(--ink)">Þessi þurfa meiri æfingu:</b></p><div class="chips">${chips}</div>` : ''}`;
      $('btnMissed').hidden = n === 0;
      $('btnMissed').textContent = `Æfa þau sem ég missti af (${n})`;
      return;
    }
    done.hidden = true; $('doneActions').hidden = true;
    card.hidden = false; $('actions').hidden = false;

    const w = byId[s.queue[0]];
    const f = faceHTML(w, 'front'), b = faceHTML(w, 'back');
    front.className = 'face front ' + f.cls; front.innerHTML = f.html;
    back.className = 'face back ' + b.cls; back.innerHTML = b.html;
    card.classList.toggle('flipped', !!s.flipped);
  }

  /* ---- actions ---- */
  function flip() {
    const s = session(); if (!s.queue.length) return;
    s.flipped = !s.flipped; save();
    card.classList.toggle('flipped', s.flipped);
  }
  let busy = false;
  function mark(knew) {
    const s = session(); if (!s.queue.length || busy) return;
    busy = true;
    const dur = RM ? 0 : 220;
    card.classList.add(knew ? 'leave-right' : 'leave-left');
    setTimeout(() => {
      const id = s.queue.shift();
      if (knew) s.known.push(id);
      else { s.queue.push(id); if (!s.missed.includes(id)) s.missed.push(id); }
      s.flipped = false; save();
      card.classList.add('no-anim');
      card.classList.remove('leave-right', 'leave-left', 'flipped');
      if (!RM) card.classList.add('enter');
      render();
      void card.offsetWidth;
      requestAnimationFrame(() => { card.classList.remove('no-anim'); requestAnimationFrame(() => { card.classList.remove('enter'); busy = false; }); });
    }, dur);
  }
  function resetAll() { state.sessions[key()] = newSession(deckIds(state.deck)); save(); render(); }
  function practiceMissed() { const s = session(); if (!s.missed.length) return resetAll(); state.sessions[key()] = newSession(s.missed, s.round + 1, true); save(); render(); }

  /* ---- events ---- */
  let ignoreClickUntil = 0;
  card.addEventListener('click', () => { if (Date.now() < ignoreClickUntil) return; flip(); });
  card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  let tx = 0, ty = 0, tt = 0;
  card.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, { passive: true });
  card.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - tt < 800) {
      ignoreClickUntil = Date.now() + 400;
      mark(dx > 0);
    }
  }, { passive: true });
  $('btnKnow').addEventListener('click', () => mark(true));
  $('btnAgain').addEventListener('click', () => mark(false));
  $('btnReset').addEventListener('click', resetAll);
  $('btnAll').addEventListener('click', resetAll);
  $('btnMissed').addEventListener('click', practiceMissed);
  document.querySelectorAll('#deckSeg button').forEach(b => b.addEventListener('click', () => { state.deck = b.dataset.deck; save(); render(); renderList(); }));
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); render(); }));

  document.addEventListener('keydown', e => {
    if (!$('list').hidden) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); mark(true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); mark(false); }
    else if ((e.key === ' ' || e.key === 'Enter') && e.target !== card) { e.preventDefault(); flip(); }
  });

  /* ---- list view ---- */
  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const chapters = state.deck === 'all' ? DATA.chapters : DATA.chapters.filter(c => c.id === state.deck);
    let html = '';
    chapters.forEach(c => {
      const rows = WORDS.filter(w => w.ch === c.id && (!q || [w.en, w.def, w.is, w.alt || ''].some(x => x.toLowerCase().includes(q))));
      if (!rows.length && q) return;
      html += `<div class="group"><h2>${esc(c.label)}: ${esc(c.title)}<small>${rows.length} orð</small></h2><div class="tablewrap"><table>
        <thead><tr><th>Orð</th><th>Setning</th><th>Íslenska</th></tr></thead><tbody>` +
        rows.map(w => `<tr><td class="w">${esc(w.en)}</td><td class="d">${esc(w.def)}</td><td class="i"><span class="is">${esc(w.is)}</span>${w.alt ? `<span class="alt">${esc(w.alt)}</span>` : ''}</td></tr>`).join('') +
        `</tbody></table></div></div>`;
    });
    $('listBody').innerHTML = html || `<p class="empty">Ekkert orð fannst fyrir „${esc(q)}“.</p>`;
  }
  $('search').addEventListener('input', renderList);
  $('listToggle').addEventListener('click', () => {
    const showList = $('list').hidden;
    $('list').hidden = !showList; $('study').hidden = showList;
    $('listToggle').textContent = showList ? 'Spjöld' : 'Orðalisti';
    $('listToggle').setAttribute('aria-pressed', String(showList));
    if (showList) { renderList(); $('search').focus({ preventScroll: true }); }
  });

  render();
})();
</script>
</body>
</html>
