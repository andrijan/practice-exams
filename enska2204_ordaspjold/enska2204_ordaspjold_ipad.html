":"t1","en":"genetics","def":"The study of genes and heredity.","is":"erfðafræði"},{"ch":"t1","en":"suggest","def":"To propose or recommend something.","is":"leggja til","alt":"stinga upp á"},{"ch":"t1","en":"intervention","def":"An action taken to improve a situation.","is":"inngrip"},{"ch":"t1","en":"boost","def":"To increase or enhance.","is":"auka","alt":"efla"},{"ch":"t2","en":"gripped","def":"Held tightly or firmly.","is":"gripinn","alt":"heltekinn"},{"ch":"t2","en":"all of a sudden","def":"Suddenly or unexpectedly.","is":"allt í einu","alt":"skyndilega"},{"ch":"t2","en":"realize","def":"To become aware of something or understand it.","is":"átta sig á","alt":"gera sér grein fyrir"},{"ch":"t2","en":"absorbed","def":"Completely engrossed or immersed in something.","is":"niðursokkinn","alt":"gagntekinn"},{"ch":"t2","en":"to perfect","def":"To make something as good as it can be.","is":"fullkomna"},{"ch":"t2","en":"fiercely","def":"With great intensity or determination.","is":"ákaft","alt":"harkalega, grimmilega"},{"ch":"t2","en":"concentrate","def":"To focus one's attention or efforts on a particular task.","is":"einbeita sér"},{"ch":"t2","en":"engagement","def":"Active involvement or participation.","is":"þátttaka","alt":"virkni"},{"ch":"t2","en":"typically","def":"Usually or generally.","is":"venjulega","alt":"yfirleitt"},{"ch":"t2","en":"occur","def":"To happen or take place.","is":"gerast","alt":"eiga sér stað"},{"ch":"t2","en":"contrary to","def":"In opposition to or different from.","is":"þvert á","alt":"andstætt"},{"ch":"t2","en":"passive","def":"Inactive or not taking action.","is":"óvirkur","alt":"aðgerðalaus"},{"ch":"t2","en":"receptive","def":"Willing to accept or open to new ideas or experiences.","is":"móttækilegur"},{"ch":"t2","en":"voluntarily","def":"By choice or willingly.","is":"af fúsum vilja","alt":"sjálfviljugur"},{"ch":"t2","en":"to its limits","def":"To the maximum extent possible.","is":"til hins ýtrasta","alt":"að þolmörkum"},{"ch":"t2","en":"accomplish","def":"To achieve or complete a task or goal.","is":"áorka","alt":"ljúka við, afreka"},{"ch":"t2","en":"worthwhile","def":"Deserving of time, effort, or attention.","is":"þess virði","alt":"verðugur"},{"ch":"t2","en":"in turn","def":"As a result or consequence.","is":"í kjölfarið","alt":"aftur á móti"},{"ch":"t2","en":"reflect","def":"To think deeply or ponder.","is":"íhuga","alt":"hugleiða"},{"ch":"t2","en":"however","def":"Nevertheless or nonetheless.","is":"hins vegar","alt":"þó, samt"},{"ch":"t2","en":"necessarily","def":"Inevitably or as a requirement.","is":"nauðsynlega","alt":"óhjákvæmilega"},{"ch":"t2","en":"pleasant","def":"Enjoyable or agreeable.","is":"ánægjulegur","alt":"notalegur"},{"ch":"t2","en":"ache","def":"A continuous, dull pain.","is":"verkur","alt":"seyðingur"},{"ch":"t2","en":"explode","def":"To burst or break apart suddenly with force.","is":"springa"},{"ch":"t2","en":"overcome with","def":"Overwhelmed by a strong emotion or feeling.","is":"yfirkominn af"},{"ch":"t2","en":"accomplish goals","def":"Achieve objectives or targets.","is":"ná markmiðum"},{"ch":"t2","en":"sense of mastery","def":"Feeling of competence or expertise.","is":"tilfinning fyrir leikni","alt":"að hafa vald á e-u"},{"ch":"t2","en":"self-consciousness","def":"Awareness and concern about one's self or appearance.","is":"sjálfsmeðvitund","alt":"feimni"},{"ch":"t2","en":"intellectual","def":"Related to the mind or mental abilities.","is":"vitsmunalegur"},{"ch":"t2","en":"social","def":"Related to interactions with others.","is":"félagslegur"},{"ch":"t2","en":"physical","def":"Related to the body or physical attributes.","is":"líkamlegur"},{"ch":"t2","en":"psychology","def":"The study of the mind and behavior.","is":"sálfræði"},{"ch":"t2","en":"drift along","def":"To move slowly or without purpose.","is":"láta reka","alt":"berast með straumnum"},{"ch":"t2","en":"achieve","def":"To accomplish or attain a goal.","is":"ná (markmiði)","alt":"afreka"},{"ch":"t2","en":"voluntary","def":"Done willingly or by choice.","is":"sjálfviljugur","alt":"valfrjáls"},{"ch":"t2","en":"enjoyable","def":"Pleasurable or fun.","is":"skemmtilegur","alt":"ánægjulegur"},{"ch":"t2","en":"require","def":"To need or demand.","is":"krefjast","alt":"þarfnast"},{"ch":"t2","en":"immediate","def":"Happening right away or without delay.","is":"tafarlaus","alt":"umsvifalaus"},{"ch":"t2","en":"feedback","def":"Information or input provided in response to an action or performance.","is":"endurgjöf"},{"ch":"t2","en":"performance","def":"The execution or presentation of a task or skill.","is":"frammistaða"},{"ch":"t2","en":"growth","def":"The process of development or increase.","is":"vöxtur"},{"ch":"t2","en":"thus","def":"Therefore or as a result.","is":"þess vegna","alt":"þannig"},{"ch":"t2","en":"notion","def":"An idea or concept.","is":"hugmynd","alt":"hugtak"},{"ch":"t2","en":"confront","def":"To face or address a problem or challenge directly.","is":"takast á við","alt":"horfast í augu við"},{"ch":"t2","en":"challenge","def":"A difficult task or problem.","is":"áskorun"},{"ch":"t2","en":"tension","def":"Stress or strain caused by opposing forces.","is":"togstreita","alt":"spenna"},{"ch":"t2","en":"pressures","def":"External demands or stresses.","is":"álag","alt":"þrýstingur"},{"ch":"t2","en":"encourage","def":"To motivate or inspire.","is":"hvetja"},{"ch":"t2","en":"strive","def":"To make great efforts or work hard toward a goal.","is":"keppast við","alt":"kappkosta"},{"ch":"t2","en":"self-fulfillment","def":"Achieving personal satisfaction or happiness (like finally reaching a certain goal like buying a house).","is":"lífsfylling"},{"ch":"t2","en":"ambition","def":"A strong desire to achieve success or reach goals.","is":"metnaður"},{"ch":"t2","en":"scientist","def":"A person who conducts scientific research or studies.","is":"vísindamaður"},{"ch":"t2","en":"pronounce","def":"To say or articulate words clearly.","is":"bera fram"},{"ch":"t2","en":"productivity","def":"The measure of how efficiently tasks are completed.","is":"framleiðni","alt":"afköst"},{"ch":"t2","en":"success","def":"The achievement of a desired outcome or goal.","is":"árangur","alt":"velgengni"},{"ch":"t2","en":"interval","def":"A period of time between events or actions.","is":"millibil","alt":"hlé"},{"ch":"t2","en":"generally","def":"In a general or widespread manner.","is":"almennt","alt":"yfirleitt"},{"ch":"t2","en":"measure","def":"To determine the size, quantity, or extent of something.","is":"mæla"},{"ch":"t2","en":"interestingly","def":"In an intriguing or captivating way.","is":"athyglisvert","alt":"áhugavert"},{"ch":"t2","en":"apparently","def":"Seemingly or based on available evidence.","is":"að því er virðist","alt":"greinilega"},{"ch":"t2","en":"peers","def":"Individuals of the same age, status, or group.","is":"jafningjar","alt":"jafnaldrar"},{"ch":"t2","en":"amusements","def":"Activities or forms of entertainment.","is":"skemmtanir","alt":"afþreying"},{"ch":"t2","en":"socializing","def":"Interacting with others in a social setting.","is":"félagslíf","alt":"að umgangast aðra"},{"ch":"t2","en":"long-term","def":"Over an extended period.","is":"langtíma-","alt":"til langs tíma"},{"ch":"t2","en":"benefits","def":"Advantages or positive outcomes.","is":"ávinningur","alt":"kostir"},{"ch":"t2","en":"distracted by","def":"Diverted or unfocused due to something less important.","is":"truflaður af","alt":"með hugann við annað"},{"ch":"t2","en":"trivial","def":"Unimportant or insignificant.","is":"ómerkilegur","alt":"smávægilegur"},{"ch":"t2","en":"fictional","def":"Imaginary or not based on reality.","is":"skáldaður","alt":"ímyndaður"},{"ch":"t2","en":"hypothesis","def":"A proposed explanation or educated guess.","is":"tilgáta"},{"ch":"t2","en":"initial","def":"At the beginning or first stage.","is":"upphaflegur","alt":"fyrsti"},{"ch":"t2","en":"motivation","def":"The inner drive or incentive to act.","is":"hvatning","alt":"áhugahvöt, drifkraftur"},{"ch":"t2","en":"concentration","def":"Focused attention or mental effort.","is":"einbeiting"}]};
  const CH = Object.fromEntries(DATA.chapters.map(c => [c.id, c]));
  const WORDS = DATA.words.map((w, i) => Object.assign({ id: w.ch + ':' + i }, w));
  const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));
  const STORE = 'enska2204-ordaspjold-v1';
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const card = $('card'), front = $('front'), back = $('back'), done = $('done');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function deckIds(deck) {
    if (deck === 'all') {
      const seen = new Set();
      return WORDS.filter(w => { const k = w.en.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).map(w => w.id);
    }
    return WORDS.filter(w => w.ch === deck).map(w => w.id);
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  let state = { deck: 't1', mode: 'en-is', sessions: {} };
  try { const raw = localStorage.getItem(STORE); if (raw) { const s = JSON.parse(raw); if (s && s.sessions && s.deck && s.mode) state = s; } } catch (e) { }
  if (!['t1', 't2', 'all'].includes(state.deck)) state.deck = 't1';
  if (!['en-is', 'is-en', 'def-en'].includes(state.mode)) state.mode = 'en-is';
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { } }

  function newSession(ids, round, subset) { return { queue: shuffle(ids), known: [], missed: [], round: round || 1, subset: !!subset, flipped: false }; }
  const key = () => state.deck + '|' + state.mode;
  function session() {
    const all = deckIds(state.deck), set = new Set(all);
    let s = state.sessions[key()];
    if (!s || !Array.isArray(s.queue)) { s = state.sessions[key()] = newSession(all); return s; }
    s.queue = s.queue.filter(id => set.has(id));
    s.known = (s.known || []).filter(id => set.has(id));
    s.missed = (s.missed || []).filter(id => set.has(id));
    if (!s.subset) { const have = new Set([...s.queue, ...s.known]); all.forEach(id => { if (!have.has(id)) s.queue.push(id); }); }
    if (!s.queue.length && !s.known.length) s = state.sessions[key()] = newSession(all);
    return s;
  }

  /* ---- rendering ---- */
  function tab(w) { const c = CH[w.ch]; return esc(c.label + ' · ' + c.title); }
  function faceHTML(w, side) {
    const m = state.mode;
    let lang, cls, main, extra = '';
    if (side === 'front') {
      if (m === 'en-is') { lang = 'Enska'; cls = 'en'; main = `<div class="word en">${esc(w.en)}</div>`; }
      else if (m === 'is-en') { lang = 'Íslenska'; cls = 'is'; main = `<div class="word is">${esc(w.is)}</div>` + (w.alt ? `<div class="alt">einnig: ${esc(w.alt)}</div>` : ''); }
      else { lang = 'Skýring'; cls = 'def'; main = `<div class="word def">${esc(w.def)}</div>`; }
    } else {
      if (m === 'en-is') {
        lang = 'Íslenska'; cls = 'is';
        main = `<div class="word is">${esc(w.is)}</div>` + (w.alt ? `<div class="alt">einnig: ${esc(w.alt)}</div>` : '');
        extra = `<hr class="rule"><div class="gloss">${esc(w.def)}</div>`;
      } else if (m === 'is-en') {
        lang = 'Enska'; cls = 'en';
        main = `<div class="word en">${esc(w.en)}</div>`;
        extra = `<hr class="rule"><div class="gloss">${esc(w.def)}</div>`;
      } else {
        lang = 'Enska'; cls = 'en';
        main = `<div class="word en">${esc(w.en)}</div>`;
        extra = `<hr class="rule"><div class="gloss"><span class="k">ÍS</span><span class="is">${esc(w.is)}</span>${w.alt ? ` <span class="alt">(${esc(w.alt)})</span>` : ''}</div>`;
      }
    }
    return { cls, html: `<div class="meta"><span class="tab">${tab(w)}</span><span class="lang ${cls}">${lang}</span></div><div class="body">${main}${extra}</div><div class="tip">bankaðu til að snúa</div>` };
  }

  function renderControls() {
    document.querySelectorAll('#deckSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.deck === state.deck)));
    document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  }

  function render() {
    renderControls();
    const s = session();
    const total = s.queue.length + s.known.length;
    const known = s.known.length;
    $('fill').style.width = (total ? (known / total) * 100 : 0) + '%';
    $('countKnown').innerHTML = `Kunni <b>${known}</b> af ${total}`;
    $('countLeft').innerHTML = (s.round > 1 ? `Umferð ${s.round} · ` : '') + `Eftir <b>${s.queue.length}</b>`;

    if (!s.queue.length) {
      card.hidden = true; $('actions').hidden = true;
      done.hidden = false; $('doneActions').hidden = false;
      const n = s.missed.length;
      const chips = s.missed.map(id => byId[id]).filter(Boolean).map(w => `<span class="chip">${esc(w.en)} · <span class="is">${esc(w.is)}</span></span>`).join('');
      done.innerHTML = `<div class="eyebrow">${s.round > 1 ? 'Umferð ' + s.round + ' lokið' : 'Umferð lokið'}</div>
        <div class="big">${total - n} <span style="font-size:.5em;color:var(--muted);font-weight:500">af ${total}</span></div>
        <p>${n === 0 ? 'Allt rétt í fyrstu tilraun. Vel gert!' : 'rétt í fyrstu tilraun'}</p>
        ${n ? `<p style="margin-top:.8rem"><b style="color:var(--ink)">Þessi þurfa meiri æfingu:</b></p><div class="chips">${chips}</div>` : ''}`;
      $('btnMissed').hidden = n === 0;
      $('btnMissed').textContent = `Æfa þau sem ég missti af (${n})`;
      return;
    }
    done.hidden = true; $('doneActions').hidden = true;
    card.hidden = false; $('actions').hidden = false;

    const w = byId[s.queue[0]];
    const f = faceHTML(w, 'front'), b = faceHTML(w, 'back');
    front.className = 'face front ' + f.cls; front.innerHTML = f.html;
    back.className = 'face back ' + b.cls; back.innerHTML = b.html;
    card.classList.toggle('flipped', !!s.flipped);
  }

  /* ---- actions ---- */
  function flip() {
    const s = session(); if (!s.queue.length) return;
    s.flipped = !s.flipped; save();
    card.classList.toggle('flipped', s.flipped);
  }
  let busy = false;
  function mark(knew) {
    const s = session(); if (!s.queue.length || busy) return;
    busy = true;
    const dur = RM ? 0 : 220;
    card.classList.add(knew ? 'leave-right' : 'leave-left');
    setTimeout(() => {
      const id = s.queue.shift();
      if (knew) s.known.push(id);
      else { s.queue.push(id); if (!s.missed.includes(id)) s.missed.push(id); }
      s.flipped = false; save();
      card.classList.add('no-anim');
      card.classList.remove('leave-right', 'leave-left', 'flipped');
      if (!RM) card.classList.add('enter');
      render();
      void card.offsetWidth;
      requestAnimationFrame(() => { card.classList.remove('no-anim'); requestAnimationFrame(() => { card.classList.remove('enter'); busy = false; }); });
    }, dur);
  }
  function resetAll() { state.sessions[key()] = newSession(deckIds(state.deck)); save(); render(); }
  function practiceMissed() { const s = session(); if (!s.missed.length) return resetAll(); state.sessions[key()] = newSession(s.missed, s.round + 1, true); save(); render(); }

  /* ---- events ---- */
  let ignoreClickUntil = 0;
  card.addEventListener('click', () => { if (Date.now() < ignoreClickUntil) return; flip(); });
  card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  let tx = 0, ty = 0, tt = 0;
  card.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, { passive: true });
  card.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - tt < 800) {
      ignoreClickUntil = Date.now() + 400;
      mark(dx > 0);
    }
  }, { passive: true });
  $('btnKnow').addEventListener('click', () => mark(true));
  $('btnAgain').addEventListener('click', () => mark(false));
  $('btnReset').addEventListener('click', resetAll);
  $('btnAll').addEventListener('click', resetAll);
  $('btnMissed').addEventListener('click', practiceMissed);
  document.querySelectorAll('#deckSeg button').forEach(b => b.addEventListener('click', () => { state.deck = b.dataset.deck; save(); render(); renderList(); }));
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); render(); }));

  document.addEventListener('keydown', e => {
    if (!$('list').hidden) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); mark(true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); mark(false); }
    else if ((e.key === ' ' || e.key === 'Enter') && e.target !== card) { e.preventDefault(); flip(); }
  });

  /* ---- list view ---- */
  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const chapters = state.deck === 'all' ? DATA.chapters : DATA.chapters.filter(c => c.id === state.deck);
    let html = '';
    chapters.forEach(c => {
      const rows = WORDS.filter(w => w.ch === c.id && (!q || [w.en, w.def, w.is, w.alt || ''].some(x => x.toLowerCase().includes(q))));
      if (!rows.length && q) return;
      html += `<div class="group"><h2>${esc(c.label)}: ${esc(c.title)}<small>${rows.length} orð</small></h2><div class="tablewrap"><table>
        <thead><tr><th>Orð</th><th>Skýring</th><th>Íslenska</th></tr></thead><tbody>` +
        rows.map(w => `<tr><td class="w">${esc(w.en)}</td><td class="d">${esc(w.def)}</td><td class="i"><span class="is">${esc(w.is)}</span>${w.alt ? `<span class="alt">${esc(w.alt)}</span>` : ''}</td></tr>`).join('') +
        `</tbody></table></div></div>`;
    });
    $('listBody').innerHTML = html || `<p class="empty">Ekkert orð fannst fyrir „${esc(q)}“.</p>`;
  }
  $('search').addEventListener('input', renderList);
  $('listToggle').addEventListener('click', () => {
    const showList = $('list').hidden;
    $('list').hidden = !showList; $('study').hidden = showList;
    $('listToggle').textContent = showList ? 'Spjöld' : 'Orðalisti';
    $('listToggle').setAttribute('aria-pressed', String(showList));
    if (showList) { renderList(); $('search').focus({ preventScroll: true }); }
  });

  render();
})();
</script>
